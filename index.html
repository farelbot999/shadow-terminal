<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Terminal — by AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay-scanline"></div>
<div class="overlay-vignette"></div>
<div class="overlay-noise"></div>

<!-- Boot Screen -->
<div id="boot-screen">
  <div class="boot-content">
    <div class="boot-logo">SHADOW TERMINAL</div>
    <div class="boot-sub">// INITIALIZING SECURE SESSION...</div>
    <div class="boot-bar"><div class="boot-bar-fill"></div></div>
    <div class="boot-lines" id="boot-lines"></div>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">

  <header id="header">
    <div class="header-left">
      <span class="logo-mark">▓</span>
      <div class="header-title">
        <span class="title-main">SHADOW TERMINAL</span>
        <span class="title-sub">// by AI — multi-provider</span>
      </div>
    </div>
    <div class="header-right">
      <div class="status-indicator">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">OFFLINE</span>
      </div>
      <button class="btn-icon" id="btn-config" title="Config">⚙</button>
      <button class="btn-icon" id="btn-clear" title="Clear">✕</button>
    </div>
  </header>

  <main id="terminal-wrap">
    <div id="terminal"></div>
  </main>

  <div id="thinking" class="hidden">
    <div class="think-dots"><span></span><span></span><span></span></div>
    <span>Shadow memproses...</span>
  </div>

  <footer id="input-area">
    <div class="input-row">
      <span class="prompt-sym">▸</span>
      <input type="text" id="user-input" placeholder="ketik pesan..." autocomplete="off" spellcheck="false">
      <button id="send-btn">KIRIM</button>
    </div>
    <div class="input-meta">
      <span id="model-label">—</span>
      <span>ENTER kirim &nbsp;·&nbsp; /help perintah</span>
    </div>
  </footer>

</div>

<!-- Modal Config -->
<div id="modal-overlay" class="hidden"></div>
<div id="modal-config" class="hidden">
  <div class="modal-header">
    <span class="modal-title">[ KONFIGURASI ]</span>
    <button class="modal-close" id="modal-close">✕</button>
  </div>

  <div class="field-group">
    <label>PROVIDER</label>
    <div class="provider-tabs" id="provider-tabs">
      <button class="ptab active" data-p="openrouter">OpenRouter</button>
      <button class="ptab" data-p="anthropic">Anthropic</button>
      <button class="ptab" data-p="gemini">Gemini</button>
      <button class="ptab" data-p="openai">OpenAI</button>
    </div>
  </div>

  <div class="field-group">
    <label>API KEY</label>
    <div class="key-row">
      <input type="password" id="cfg-key" placeholder="Masukkan API Key...">
      <button class="btn-eye" id="btn-eye">👁</button>
    </div>
    <div class="field-hint" id="key-hint">openrouter.ai → Keys → Create Key</div>
  </div>

  <div class="field-group">
    <label>MODEL</label>
    <select id="cfg-model"></select>
  </div>

  <div class="modal-actions">
    <button class="btn-secondary" id="btn-cancel">BATAL</button>
    <button class="btn-primary" id="btn-save">SIMPAN</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
